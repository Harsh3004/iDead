name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  cpp-build-and-test:
    name: C++17 Core Engine (CMake & CTest)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Ninja
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build

      - name: Set up CMake
        uses: jwlawson/actions-setup-cmake@v2
        with:
          cmake-version: '3.28.x'

      - name: Configure CMake
        run: cmake -B build -G Ninja -DCMAKE_BUILD_TYPE=Release

      - name: Build Core Engine & Tests
        run: cmake --build build

      - name: Run CTest Test Suites
        run: ctest --test-dir build --output-on-failure

  python-test-pipeline:
    name: Python Dataeval & Fixture Pipeline (3.11)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Dependencies & Dataeval
        run: |
          python -m pip install --upgrade pip
          pip install -e ./dataeval

      - name: Run Full Test Suite (64 unit & integration tests)
        run: |
          python -m unittest discover -s dataeval/tests -p "test_*.py" -v

      - name: Verify Diagnostic Plot Generation on Fixture Data
        run: |
          python -m dataeval.harness.make_plots \
            --leaderboard-csv dataeval/tests/fixtures/results/leaderboard.csv \
            --summary-csv dataeval/tests/fixtures/results/leaderboard_summary.csv \
            --outages-dir dataeval/tests/fixtures/processed/outages \
            --prediction-dir dataeval/tests/fixtures/processed/cpp_predictions \
            --plots-dir /tmp/ci_plots